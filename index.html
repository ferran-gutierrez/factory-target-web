<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory Target Web</title>
    <style>
      #app svg path[data-country-code] {
        fill: #b8c5d6;
        stroke: #475569;

        stroke-width: 0.5;

    <main id="app"></main>
